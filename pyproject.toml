[project]
name = "postshot-script"
version = "0.1.0"
description = "PowerShell scripts and Python utilities for processing drone footage through COLMAP and Postshot 3DGS pipeline"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "lpips>=0.1.4",
    "matplotlib>=3.10.8",
    "numpy>=2.4.2",
    "opencv-python>=4.13.0.92",
    "pillow>=12.2.0",
    "plyfile>=1.1.3",
    "torch>=2.5.1",
    "torchvision>=0.20.1",
]

[[tool.uv.index]]
name = "pytorch-cu121"
url = "https://download.pytorch.org/whl/cu121"
explicit = true

[tool.uv.sources]
torch = { index = "pytorch-cu121" }
torchvision = { index = "pytorch-cu121" }
